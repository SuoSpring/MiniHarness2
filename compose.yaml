services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: miniharness
      POSTGRES_PASSWORD: miniharness
      POSTGRES_DB: miniharness
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniharness"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
